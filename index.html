<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Random redirect</title>
</head>
<body>
<script>
  var links = [
    "https://www.google.com/search?q=one",
    "https://www.google.com/search?q=two",
    "https://www.google.com/search?q=three",
    "https://www.google.com/search?q=four",
    "https://www.google.com/search?q=five",
  ];

  if (links.length) {
    var i = Math.floor(Math.random() * links.length);
    window.location.href = links[i];
  } else {
    document.body.textContent = "No links configured.";
  }
</script>
</body>
</html>
