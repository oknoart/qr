<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Random redirect</title>
</head>
<body>
<script>
  var links = [
    "https://i.pinimg.com/originals/b7/fb/80/b7fb80122cf46d0e584f3a0768aef282.gif",
    "mailto:hello@teapot.agency?subject=Hi%20Teapot%2C%20I%20would%20love%20to%20work%20with%20you.",
  ];

  if (links.length) {
    var i = Math.floor(Math.random() * links.length);
    window.location.href = links[i];
  } else {
    document.body.textContent = "No links configured.";
  }
</script>
</body>
</html>
